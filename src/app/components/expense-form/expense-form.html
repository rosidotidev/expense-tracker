<div class="card">
  <h2 class="card-title">Registra spesa</h2>

  <form (ngSubmit)="submit()" class="expense-form">
    <div class="form-row">
      <div class="form-group">
        <label for="who">Chi ha speso *</label>
        <select id="who" [(ngModel)]="who" name="who" required>
          <option value="" disabled>Seleziona persona</option>
          @for (person of people; track person) {
            <option [value]="person">{{ person }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="amount">Quanto (€) *</label>
        <input
          id="amount"
          type="number"
          [(ngModel)]="amount"
          name="amount"
          step="0.01"
          min="0"
          placeholder="0.00"
          required
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="date">Giorno *</label>
        <input id="date" type="date" [(ngModel)]="date" name="date" required />
      </div>

      <div class="form-group">
        <label for="where">Dove *</label>
        <input
          id="where"
          type="text"
          [(ngModel)]="where"
          name="where"
          placeholder="Es. Supermercato"
          required
        />
      </div>
    </div>

    <div class="form-group">
      <label for="category">Categoria *</label>
      <select id="category" [(ngModel)]="category" name="category" required>
        <option value="" disabled>Seleziona categoria</option>
        @for (cat of categories; track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="notes">Note</label>
      <textarea
        id="notes"
        [(ngModel)]="notes"
        name="notes"
        rows="2"
        placeholder="Note aggiuntive (opzionale)"
      ></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        @if (loading) {
          <span class="spinner"></span>
        }
        Aggiungi spesa
      </button>
      <button type="button" class="btn btn-outline" (click)="reset()">Pulisci</button>
    </div>
  </form>
</div>
